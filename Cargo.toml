[package]
name = "oled-customizer"
version = "2.0.0"
edition = "2021"
default-run = "oled-customizer"
description = "OLED Customizer - Native dashboard for SteelSeries 128x40 OLED displays"

[dependencies]
eframe = "0.31"
tray-icon = "0.20"
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
] }
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
chrono = "0.4"
libloading = "0.8"
log = "0.4"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
